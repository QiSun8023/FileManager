<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>文件管理助手</title>
<link rel="stylesheet" href="miuix.css">
<link rel="stylesheet" href="watch-editor.css">
<link rel="stylesheet" href="dashboard.css">
<script defer src="icons.js"></script>
<script defer src="watch-editor.js"></script>
<script defer src="dashboard.js"></script>
</head>
<body>
<header class="mx-topbar" id="topbar">
  <div class="mx-topbar-start"></div>
  <div class="mx-topbar-title" id="topbar-title">文件管理</div>
  <div class="mx-topbar-actions"><button id="refresh" class="mx-icon-button" type="button" aria-label="刷新状态" title="刷新状态" data-icon="refresh"></button></div>
</header>
<main class="mx-page">
<div class="mx-large-title"><h1 id="page-title">文件管理</h1></div>
<div id="message" class="mx-notice" role="status" hidden></div>

<section id="overview" class="page">
  <div class="mx-card status-card">
    <div class="mx-row">
      <span class="mx-row-icon status-icon" id="status-icon" data-icon="watch"></span>
      <span class="mx-row-text"><span class="mx-row-title" id="hero-title">连接模块</span><span class="mx-row-summary" id="hero-desc">连接后查看文件监控与转移提醒</span></span>
    </div>
    <div class="mx-subpanel status-foot"><span id="connection" class="mx-pill">尚未连接</span><span class="mx-pill version">助手</span></div>
    <div class="mx-subpanel" id="connect-panel"><button id="connect" class="mx-button is-primary is-block" type="button"><span data-icon="plug"></span>连接模块</button></div>
  </div>
  <div class="mx-stats">
    <div class="mx-stat"><strong id="dir-count">—</strong><span>监控目录</span></div>
    <div class="mx-stat"><strong id="type-count">—</strong><span>文件类型</span></div>
    <div class="mx-stat"><strong id="pending-count">—</strong><span>待处理</span></div>
  </div>
  <div class="mx-small-title">文件整理</div>
  <div class="mx-card">
    <button data-page="monitor" class="mx-row" type="button"><span class="mx-row-icon" data-icon="folder"></span><span class="mx-row-text"><span class="mx-row-title">监控规则</span><span class="mx-row-summary">多个目录、多种类型、一个目标</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
    <button data-page="pending" class="mx-row" type="button"><span class="mx-row-icon" data-icon="transfer"></span><span class="mx-row-text"><span class="mx-row-title">待转移文件</span><span class="mx-row-summary">确认后才会移动</span></span><span class="mx-row-end"><span class="mx-badge" id="pending-badge" hidden></span><span data-icon="chevron"></span></span></button>
  </div>
  <div class="mx-small-title">运行保障</div>
  <div class="mx-card">
    <button data-page="settings" class="mx-row permission-summary" type="button" id="permission-row"><span class="mx-row-icon" id="permission-icon" data-icon="shield"></span><span class="mx-row-text"><span class="mx-row-title" id="permission-title">检查提醒权限</span><span class="mx-row-summary" id="permission-summary">通知与悬浮窗状态</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
  </div>
</section>

<section id="monitor" class="page" hidden>
  <div class="mx-card">
    <label class="mx-row switch-row"><span class="mx-row-icon" data-icon="watch"></span><span class="mx-row-text"><span class="mx-row-title">启用文件夹监控</span><span class="mx-row-summary"><span id="monitor-state">可先开启，再添加监控目录</span></span></span><input id="enabled" disabled class="mx-switch" type="checkbox" role="switch"></label>
    <label class="mx-row mx-setting-row" for="stable"><span class="mx-row-icon" data-icon="clock"></span><span class="mx-row-text"><span class="mx-row-title">无法确认完成时等待</span></span><select id="stable" class="mx-select"><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="60">60 秒</option><option value="120">2 分钟</option><option value="300">5 分钟</option></select></label>
  </div>
  <div class="mx-small-title has-action"><span>规则</span><button id="add" class="mx-button is-text" type="button"><span data-icon="plus" data-icon-size="18"></span>添加规则</button></div>
  <div id="rules"></div>
  <p id="save-result" class="mx-footnote" role="status" hidden></p>
  <div class="mx-section-actions"><button id="save" class="mx-button is-primary is-block" type="button"><span data-icon="save"></span>保存规则</button></div>
</section>

<section id="pending" class="page" hidden>
  <div class="mx-small-title has-action"><span>待处理文件</span><button id="refresh-pending" class="mx-icon-button" type="button" aria-label="刷新待处理文件" title="刷新" data-icon="refresh"></button></div>
  <div id="items"><div class="mx-card"><div class="mx-empty">连接模块后查看待处理文件</div></div></div>
  <p class="mx-footnote">文件保存在原处，确认后才会转移。</p>
</section>

<section id="settings" class="page" hidden>
  <div class="mx-small-title">提醒权限</div>
  <div class="mx-card">
    <button id="notification-setting" class="mx-row" type="button"><span class="mx-row-icon" data-icon="bell"></span><span class="mx-row-text"><span class="mx-row-title">通知</span><span class="mx-row-summary" id="notification-status">检查中</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
    <button id="live-setting" class="mx-row" type="button"><span class="mx-row-icon" data-icon="bell"></span><span class="mx-row-text"><span class="mx-row-title">实时更新 / 流体云</span><span class="mx-row-summary" id="live-status">检查中</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
    <button id="overlay-setting" class="mx-row" type="button"><span class="mx-row-icon" data-icon="overlay"></span><span class="mx-row-text"><span class="mx-row-title">悬浮询问</span><span class="mx-row-summary" id="overlay-status">检查中</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
    <button id="battery-setting" class="mx-row" type="button"><span class="mx-row-icon" data-icon="battery"></span><span class="mx-row-text"><span class="mx-row-title">后台运行</span><span class="mx-row-summary">在应用信息中允许后台活动与自启动</span></span><span class="mx-row-end" data-icon="chevron"></span></button>
  </div>
  <p class="mx-footnote">ColorOS 或冻结／墓碑工具需将本助手加入白名单，否则提醒会延迟。</p>
  <div class="mx-small-title">助手提醒</div>
  <div class="mx-card">
    <div class="mx-row"><span class="mx-row-icon" data-icon="phone"></span><span class="mx-row-text"><span class="mx-row-title">提醒服务</span><span class="mx-row-summary" id="reminder-state">—</span></span></div>
    <div class="mx-subpanel"><div class="mx-button-row"><button id="start" class="mx-button is-primary" type="button"><span data-icon="play"></span>启动</button><button id="pause" class="mx-button" type="button"><span data-icon="pause"></span>暂停</button></div></div>
  </div>
  <p class="mx-footnote">暂停提醒不会删除待处理记录，可在模块 WebUI 中继续处理。</p>
  <div class="mx-small-title">关于</div>
  <div class="mx-card about">
    <div class="mx-row"><span class="mx-row-icon" data-icon="folder"></span><span class="mx-row-text"><span class="mx-row-title">文件管理助手</span><span class="mx-row-summary">配置与待处理由模块保存，通知与悬浮询问由助手提供</span></span><span class="mx-row-end">v1.11.0</span></div>
  </div>
</section>
</main>

<nav class="mx-navbar bottom-navigation" aria-label="助手功能"><div class="mx-navbar-inner">
  <button data-nav="overview" class="mx-nav-item active" type="button" aria-current="page"><span class="mx-nav-icon" data-icon="home"></span><span>概览</span></button>
  <button data-nav="monitor" class="mx-nav-item" type="button"><span class="mx-nav-icon" data-icon="watch"></span><span>监控</span></button>
  <button data-nav="pending" class="mx-nav-item" type="button"><span class="mx-nav-icon" data-icon="transfer"><span class="mx-badge" id="pending-nav-badge" data-count="0"></span></span><span>待处理</span></button>
  <button data-nav="settings" class="mx-nav-item" type="button"><span class="mx-nav-icon" data-icon="settings"></span><span>设置</span></button>
</div></nav>

<dialog id="confirmation" class="mx-dialog"><h2 id="confirmation-title" class="mx-dialog-title"></h2><p id="confirmation-text" class="mx-dialog-text"></p><div class="mx-dialog-actions dialog-actions"><button id="confirmation-cancel" class="mx-button" type="button">取消</button><button id="confirmation-ok" class="mx-button is-primary primary" type="button">确认</button></div></dialog>
</body>
</html>
